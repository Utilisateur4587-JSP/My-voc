<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>P2P Call</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #111; color: #eee; min-height: 100vh; padding: 20px; }
    h1 { text-align: center; margin-bottom: 30px; font-size: 1.5rem; letter-spacing: 2px; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .card h2 { margin-bottom: 15px; font-size: 1rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    button {
      background: #2a2a2a; color: #eee; border: 1px solid #555;
      padding: 10px 20px; border-radius: 4px; cursor: pointer;
      font-family: monospace; font-size: 0.9rem; margin: 5px 5px 5px 0;
    }
    button:hover { background: #3a3a3a; }
    button.primary { background: #1a4a1a; border-color: #2d8a2d; color: #7fff7f; }
    button.primary:hover { background: #235a23; }
    button.danger { background: #4a1a1a; border-color: #8a2d2d; color: #ff7f7f; }
    button.danger:hover { background: #5a2323; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    input[type="text"] {
      width: 100%; background: #0a0a0a; color: #0f0; border: 1px solid #333;
      border-radius: 4px; padding: 10px; font-family: monospace; font-size: 1rem;
      letter-spacing: 2px;
    }
    .code-display {
      font-size: 2rem; letter-spacing: 6px; color: #7fff7f;
      background: #0a0a0a; border: 1px solid #2d8a2d;
      border-radius: 4px; padding: 15px; text-align: center;
      margin: 10px 0; cursor: pointer; user-select: all;
    }
    .code-display:hover { background: #0f1a0f; }
    .label { font-size: 0.8rem; color: #888; margin-bottom: 5px; display: block; }
    .section { margin-bottom: 15px; }
    #status {
      text-align: center; padding: 10px; border-radius: 4px;
      background: #1a1a1a; border: 1px solid #333;
      margin-bottom: 20px; font-size: 0.85rem; color: #aaa;
    }
    #status.connected { border-color: #2d8a2d; color: #7fff7f; background: #0a1a0a; }
    #status.error { border-color: #8a2d2d; color: #ff7f7f; background: #1a0a0a; }
    #status.waiting { border-color: #8a6a2d; color: #ffdd7f; background: #1a160a; }
    .media-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    #videos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
    .video-wrap { flex: 1; min-width: 200px; }
    video { background: #000; border: 1px solid #333; border-radius: 4px; width: 100%; }
    .hidden { display: none; }
    #main-menu { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
    #main-menu button { font-size: 1rem; padding: 15px 30px; }
    .hint { font-size: 0.75rem; color: #555; margin-top: 8px; }
  </style>
</head>
<body>

<div class="container">
  <h1>📞 P2P CALL</h1>

  <div id="status">En attente...</div>

  <!-- MAIN MENU -->
  <div id="main-menu">
    <button class="primary" onclick="showMode('create')">📡 Créer un appel</button>
    <button onclick="showMode('join')">🔗 Rejoindre un appel</button>
  </div>

  <!-- CREATE PANEL -->
  <div id="panel-create" class="card hidden">
    <h2>Créer un appel</h2>
    <div class="section">
      <span class="label">Ton code d'appel (clique pour copier)</span>
      <div class="code-display" id="my-code" onclick="copyCode()">...</div>
      <p class="hint">⏳ En attente que quelqu'un rejoigne avec ce code...</p>
    </div>
  </div>

  <!-- JOIN PANEL -->
  <div id="panel-join" class="card hidden">
    <h2>Rejoindre un appel</h2>
    <div class="section">
      <span class="label">Code de la personne à appeler</span>
      <input type="text" id="peer-code-input" placeholder="ex: ABC-123" maxlength="10" oninput="this.value=this.value.toUpperCase()" />
      <button class="primary" style="margin-top:10px" onclick="joinCall()">📞 Appeler</button>
    </div>
  </div>

  <!-- IN-CALL CONTROLS -->
  <div id="call-panel" class="card hidden">
    <h2>🟢 Appel en cours</h2>
    <div class="media-controls">
      <button id="btn-mic" onclick="toggleMic()">🎤 Micro : ON</button>
      <button id="btn-cam" onclick="toggleCam()">📷 Caméra : OFF</button>
      <button id="btn-screen" onclick="toggleScreen()">🖥️ Écran : OFF</button>
      <button id="btn-speaker" onclick="toggleSpeaker()">🔊 Son : ON</button>
      <button class="danger" onclick="hangUp()">📵 Raccrocher</button>
    </div>
    <div id="videos">
      <div class="video-wrap">
        <span class="label">Toi</span>
        <video id="local-video" autoplay muted playsinline></video>
      </div>
      <div class="video-wrap">
        <span class="label">Correspondant</span>
        <video id="remote-video" autoplay playsinline></video>
      </div>
    </div>
  </div>
</div>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
let peer = null;
let currentCall = null;
let localStream = null;
let screenStream = null;
let micEnabled = true;
let camEnabled = false;
let screenEnabled = false;
let speakerEnabled = true;

// ─── GENERATE SHORT CODE ──────────────────────────────────────────────────────
function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) {
    if (i === 3) code += '-';
    code += chars[Math.floor(Math.random() * chars.length)];
  }
  return code;
}

// ─── UI HELPERS ───────────────────────────────────────────────────────────────
function showMode(mode) {
  document.getElementById('main-menu').classList.add('hidden');
  document.getElementById('panel-create').classList.add('hidden');
  document.getElementById('panel-join').classList.add('hidden');
  if (mode) document.getElementById('panel-' + mode).classList.remove('hidden');
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = type || '';
}

function copyCode() {
  const code = document.getElementById('my-code').textContent;
  navigator.clipboard.writeText(code).then(() => setStatus('📋 Code copié !', 'waiting'));
}

// ─── GET LOCAL STREAM ─────────────────────────────────────────────────────────
async function getLocalStream(video = false) {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video });
  } catch(e) {
    // Try audio only if video fails
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  }
  document.getElementById('local-video').srcObject = localStream;
  return localStream;
}

// ─── CREATE CALL (HOST) ───────────────────────────────────────────────────────
async function showMode_create() { showMode('create'); }

async function initCreate() {
  setStatus('⏳ Connexion au serveur de signaling...');
  const code = genCode();
  const peerId = 'p2pcall-' + code.replace('-', '');

  peer = new Peer(peerId, { debug: 0 });

  peer.on('open', async (id) => {
    document.getElementById('my-code').textContent = code;
    setStatus('⏳ En attente d\'un correspondant...', 'waiting');

    await getLocalStream();

    peer.on('call', (call) => {
      currentCall = call;
      call.answer(localStream);
      handleCallEvents(call);
    });
  });

  peer.on('error', (e) => {
    setStatus('❌ Erreur : ' + e.message, 'error');
  });
}

// ─── JOIN CALL ────────────────────────────────────────────────────────────────
async function joinCall() {
  const raw = document.getElementById('peer-code-input').value.trim().toUpperCase();
  if (raw.length < 6) { setStatus('❌ Code invalide', 'error'); return; }

  const peerId = 'p2pcall-' + raw.replace('-', '');
  setStatus('⏳ Connexion...');

  await getLocalStream();

  peer = new Peer({ debug: 0 });

  peer.on('open', () => {
    const call = peer.call(peerId, localStream);
    currentCall = call;
    handleCallEvents(call);
  });

  peer.on('error', (e) => {
    setStatus('❌ Impossible de rejoindre : ' + e.type, 'error');
  });
}

// ─── HANDLE CALL EVENTS ───────────────────────────────────────────────────────
function handleCallEvents(call) {
  call.on('stream', (remoteStream) => {
    document.getElementById('remote-video').srcObject = remoteStream;
    setStatus('✅ Connecté !', 'connected');
    document.getElementById('call-panel').classList.remove('hidden');
    showMode(null);
  });

  call.on('close', () => {
    setStatus('📵 Appel terminé', 'error');
    document.getElementById('call-panel').classList.add('hidden');
    showMode(null);
    document.getElementById('main-menu').classList.remove('hidden');
  });

  call.on('error', (e) => {
    setStatus('❌ Erreur appel : ' + e.message, 'error');
  });
}

// ─── SHOW MODE OVERRIDE ───────────────────────────────────────────────────────
// Override showMode to auto-init create
const _originalShowMode = showMode;
function showMode(mode) {
  document.getElementById('main-menu').classList.add('hidden');
  document.getElementById('panel-create').classList.add('hidden');
  document.getElementById('panel-join').classList.add('hidden');
  if (mode === 'create') {
    document.getElementById('panel-create').classList.remove('hidden');
    initCreate();
  } else if (mode === 'join') {
    document.getElementById('panel-join').classList.remove('hidden');
  } else if (mode === null) {
    document.getElementById('main-menu').classList.remove('hidden');
  }
}

// ─── MEDIA CONTROLS ──────────────────────────────────────────────────────────
function toggleMic() {
  micEnabled = !micEnabled;
  if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
  document.getElementById('btn-mic').textContent = '🎤 Micro : ' + (micEnabled ? 'ON' : 'OFF');
}

async function toggleCam() {
  if (!camEnabled) {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: true });
      const track = s.getVideoTracks()[0];
      localStream.addTrack(track);
      if (currentCall && currentCall.peerConnection) {
        currentCall.peerConnection.addTrack(track, localStream);
      }
      document.getElementById('local-video').srcObject = localStream;
      camEnabled = true;
    } catch(e) { alert('Impossible d\'accéder à la caméra'); return; }
  } else {
    localStream.getVideoTracks().forEach(t => { t.stop(); localStream.removeTrack(t); });
    camEnabled = false;
  }
  document.getElementById('btn-cam').textContent = '📷 Caméra : ' + (camEnabled ? 'ON' : 'OFF');
}

async function toggleScreen() {
  if (!screenEnabled) {
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      const track = screenStream.getVideoTracks()[0];
      if (currentCall && currentCall.peerConnection) {
        const senders = currentCall.peerConnection.getSenders();
        const vs = senders.find(s => s.track && s.track.kind === 'video');
        if (vs) vs.replaceTrack(track);
        else currentCall.peerConnection.addTrack(track, localStream);
      }
      document.getElementById('local-video').srcObject = screenStream;
      screenEnabled = true;
      track.onended = () => {
        screenEnabled = false;
        document.getElementById('btn-screen').textContent = '🖥️ Écran : OFF';
        document.getElementById('local-video').srcObject = localStream;
      };
    } catch(e) { return; }
  } else {
    if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
    screenEnabled = false;
    document.getElementById('local-video').srcObject = localStream;
  }
  document.getElementById('btn-screen').textContent = '🖥️ Écran : ' + (screenEnabled ? 'ON' : 'OFF');
}

function toggleSpeaker() {
  speakerEnabled = !speakerEnabled;
  document.getElementById('remote-video').muted = !speakerEnabled;
  document.getElementById('btn-speaker').textContent = '🔊 Son : ' + (speakerEnabled ? 'ON' : 'OFF');
}

function hangUp() {
  if (currentCall) { currentCall.close(); currentCall = null; }
  if (peer) { peer.destroy(); peer = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
  document.getElementById('call-panel').classList.add('hidden');
  document.getElementById('main-menu').classList.remove('hidden');
  document.getElementById('peer-code-input').value = '';
  micEnabled = true; camEnabled = false; screenEnabled = false; speakerEnabled = true;
  setStatus('Appel terminé');
}
</script>
</body>
</html>
